<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Daniel Katz - Professor of Mathematics at University of Kansas">
    <title>Daniel Katz - Mathematics Professor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #ede6d8;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .header {
            background: #9e9e9e;
            color: white;
            padding: 40px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 30px;
            align-items: center;
        }

        .header-content h1 {
            font-size: 2.4em;
            margin-bottom: 10px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .header-content h2 {
            font-size: 1.2em;
            font-weight: 300;
            margin-bottom: 14px;
            opacity: 0.9;
        }

        .contact {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1em;
            margin-top: 10px;
        }

        .contact a {
            color: #f0e6d2;
            text-decoration: none;
            transition: color 0.3s;
        }

        .contact a:hover {
            color: #ffffff;
        }

        .profile-image {
            width: 170px;
            height: 170px;
            object-fit: cover;
            border-radius: 6px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
        }

        .main-content {
            padding: 36px 40px;
        }

        .section {
            margin-bottom: 36px;
        }

        .section-title {
            font-size: 1.5em;
            font-weight: 400;
            color: #6d6d6d;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #d8d8d8;
            display: inline-block;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .course-card {
            background: #fafafa;
            border-radius: 8px;
            padding: 18px 20px;
            transition: box-shadow 0.2s;
            border-left: 3px solid #b0b0b0;
        }

        .course-card:hover {
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .course-card h3 {
            font-size: 1.15em;
            color: #2c3e50;
            margin-bottom: 6px;
        }

        .course-card a {
            color: #757575;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .course-card a:hover {
            color: #505050;
        }

        .links-section {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .link-button {
            background: #9e9e9e;
            color: white;
            padding: 11px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.2s;
            display: inline-block;
        }

        .link-button:hover {
            background: #8a8a8a;
        }

        .subsection {
            margin-bottom: 26px;
        }

        .subsection h3 {
            font-size: 1.3em;
            color: #34495e;
            margin-bottom: 12px;
            font-weight: 400;
        }

        @media (max-width: 768px) {
            .header {
                grid-template-columns: 1fr;
                text-align: center;
                justify-items: center;
            }

            .header-content h1 {
                font-size: 1.8em;
            }

            .profile-image {
                width: 150px;
                height: 150px;
            }

            .course-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <h1>Daniel Katz</h1>
                <h2>Professor of Mathematics</h2>
                <h2>University of Kansas</h2>
                <div class="contact">
                    <span>📧</span>
                    <a href="mailto:dlk53@ku.edu">dlk53@ku.edu</a>
                </div>
            </div>
            <img src="./DK_Web_Final.jpg" alt="Daniel Katz" class="profile-image">
        </div>

        <div class="main-content">
            <div class="section">
                <h2 class="section-title">Links</h2>
                <div class="links-section">
                    <a href="teaching/teaching_page.html" class="link-button">Teaching</a>
                    <a href="professional/professional.html" class="link-button">Research Related</a>
                    <a href="http://www.math.ku.edu" class="link-button">Mathematics Department</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
